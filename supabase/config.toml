# A string used to distinguish different Supabase projects on the same host.
project_id = "qdfvhamkbfniepilqhqt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://tele-fisio.netlify.app/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.recovery]
subject = "Redefinir senha do TeleFisio"
content_path = "./templates/recovery.html"

[functions.google-calendar-oauth-callback]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.create-saas-checkout]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
