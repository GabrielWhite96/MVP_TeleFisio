<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefinir senha do TeleFisio</title>
  </head>
  <body style="margin:0;padding:0;background:#f3fffd;font-family:Arial,Helvetica,sans-serif;color:#14302e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3fffd;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="height:6px;background:#1aa7a1;"></td>
            </tr>
            <tr>
              <td style="padding:32px 28px;">
                <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#1aa7a1;font-weight:bold;">TeleFisio</p>
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.2;">Redefinir senha</h1>
                <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">
                  Recebemos um pedido para redefinir a senha da sua conta. O link vale só para um clique e expira em breve.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:12px;background:#1aa7a1;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#f3fffd;text-decoration:none;font-weight:bold;font-size:16px;">
                        Definir nova senha
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#5b6f6d;">
                  Se você não pediu isso, pode ignorar este e-mail. Sua senha atual continua valendo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
