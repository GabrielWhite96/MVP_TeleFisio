[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SEO pages are emitted as flat `{slug}.html` files (not `{slug}/index.html`)
# so Netlify serves /slug with HTTP 200. Directory indexes would 301 to /slug/
# and conflict with canonicals/sitemap that use the no-slash URL (Google "Redirect error").
# Runtime redirect rules are written to dist/_redirects by the Vite SEO plugin.

[[redirects]]
  from = "https://tele-fisio.netlify.app/*"
  to = "https://fisionotes.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fisionotes.com.br/*"
  to = "https://fisionotes.com.br/:splat"
  status = 301
  force = true

# Trailing-slash → canonical (no slash) for SEO pages.
[[redirects]]
  from = "/sistema-para-fisioterapeutas/"
  to = "/sistema-para-fisioterapeutas"
  status = 301
  force = true

[[redirects]]
  from = "/software-para-clinicas-de-fisioterapia/"
  to = "/software-para-clinicas-de-fisioterapia"
  status = 301
  force = true

[[redirects]]
  from = "/prontuario-eletronico-fisioterapeutas/"
  to = "/prontuario-eletronico-fisioterapeutas"
  status = 301
  force = true

[[redirects]]
  from = "/ferramentas-para-fisioterapeutas/"
  to = "/ferramentas-para-fisioterapeutas"
  status = 301
  force = true

# Serve prerendered HTML for SEO paths (200 rewrite; no client redirect).
[[redirects]]
  from = "/sistema-para-fisioterapeutas"
  to = "/sistema-para-fisioterapeutas.html"
  status = 200

[[redirects]]
  from = "/software-para-clinicas-de-fisioterapia"
  to = "/software-para-clinicas-de-fisioterapia.html"
  status = 200

[[redirects]]
  from = "/prontuario-eletronico-fisioterapeutas"
  to = "/prontuario-eletronico-fisioterapeutas.html"
  status = 200

[[redirects]]
  from = "/ferramentas-para-fisioterapeutas"
  to = "/ferramentas-para-fisioterapeutas.html"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# SPA fallback for app routes. SEO .html files and rules above take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
