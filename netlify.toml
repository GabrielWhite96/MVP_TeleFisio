[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Public SEO routes are emitted as static HTML folders at build time
# (/, /sistema-para-fisioterapeutas, etc.) so crawlers get correct meta
# without relying only on client-side DocumentMeta.

[[redirects]]
  from = "https://tele-fisio.netlify.app/*"
  to = "https://fisionotes.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fisionotes.com.br/*"
  to = "https://fisionotes.com.br/:splat"
  status = 301
  force = true

# Keep static SEO files ahead of the SPA fallback.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
