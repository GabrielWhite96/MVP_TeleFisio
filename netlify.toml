[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs must stay ON for flat `{slug}.html` files:
#   /slug      → 200 (serves slug.html, extensionless)
#   /slug/     → 301 → /slug
# Do NOT add redirect rules that only change trailing slashes: Netlify
# normalizes /slug and /slug/ before matching, so `/slug/ → /slug 301!`
# becomes a self-redirect loop (exactly what broke production).
# Do NOT rewrite /slug → /slug.html either: with Pretty URLs that also loops.
[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "https://tele-fisio.netlify.app/*"
  to = "https://fisionotes.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fisionotes.com.br/*"
  to = "https://fisionotes.com.br/:splat"
  status = 301
  force = true

# Keep static SEO assets ahead of the SPA fallback.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# SPA fallback only. SEO pages are real `{slug}.html` files handled by Pretty URLs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
